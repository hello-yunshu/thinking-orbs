name: Publish GitHub Release

# Builds and attaches the installable package to a GitHub Release for every
# version tag. This fork intentionally does not publish to npm.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Pack release assets
        shell: bash
        run: |
          archive="thinking-orbs-${GITHUB_REF_NAME#v}.tgz"
          npm pack --silent
          test -f "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="thinking-orbs-${GITHUB_REF_NAME#v}.tgz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
              --verify-tag \
              --generate-notes \
              --title "thinking-orbs $GITHUB_REF_NAME"
          fi
